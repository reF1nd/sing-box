name: Verify eBPF program loading

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ebpf-verifier.yml'
      - 'common/ebpf/**'
      - 'protocol/ebpf/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Linux kernel verifier (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - system-clang
          - ndk-r29-clang21
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12

      - name: Setup Android NDK
        if: matrix.toolchain == 'ndk-r29-clang21'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Generate eBPF objects with system Clang
        if: matrix.toolchain == 'system-clang'
        env:
          BPF_CLANG: clang
        run: |
          "$BPF_CLANG" --version | tee verifier.log
          make -C common/ebpf generate
          go clean -cache

      - name: Generate eBPF objects with NDK r29 Clang 21
        if: matrix.toolchain == 'ndk-r29-clang21'
        env:
          BPF_CLANG: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
        run: |
          "$BPF_CLANG" --version | tee verifier.log
          make -C common/ebpf generate
          go clean -cache

      - name: Load program matrix
        shell: bash
        run: |
          set -euo pipefail
          cgroup_path=/sys/fs/cgroup/sing-box-ebpf-verifier
          sudo mkdir "$cgroup_path"
          trap 'sudo rmdir "$cgroup_path"' EXIT
          sudo env \
            "PATH=$PATH" \
            SING_BOX_EBPF_INTEGRATION=1 \
            SING_BOX_EBPF_INTEGRATION_CGROUP="$cgroup_path" \
            go test -v -count=1 \
              -run 'Test(CgroupBackendProgramLoad|SharedNetwork(SharedMap|Standalone)ProgramLoad)Integration' \
              -tags with_ebpf,ebpf_integration \
              ./common/ebpf 2>&1 | tee -a verifier.log

      - name: Upload verifier log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-verifier-${{ matrix.toolchain }}
          path: verifier.log
          if-no-files-found: warn
          retention-days: 14
